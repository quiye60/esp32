# ============================================================================
# 下面是「可选开关」的备忘，全部保持默认值；要用时取消注释并 cargo clean。
#
# 这些变量是 esp-hal / esp-radio / esp-alloc / esp-rtos 的编译期配置，
# 完整清单见 target/xtensa-esp32s3-none-elf/debug/build/*/out/*_config_table.md
# （本项目 teach/07-配置esp-config与env.md 有讲怎么查）。
#
# --- PSRAM（第 35 课用；只有模组带 PSRAM 才有效，例如 N16R8）---
# ESP_HAL_CONFIG_PSRAM_MODE = "octal"      # 八线 PSRAM；四线用 "quad"
#
# --- 日志级别（第 19 课 UART、第 45 课起的无线课可能想调）---
# ESP_LOG = "info"                          # off / error / warn / info / debug / trace
#
# --- 其它常用（必要时再打开，默认值就是当前行为）---
# ESP_HAL_CONFIG_PLACE_SWITCH_TABLES_IN_RAM = "true"   # 中断响应更快，多占 RAM
# ESP_HAL_CONFIG_ICACHE_SIZE = "32KB"
# ============================================================================
