[package]
edition      = "2024"
name         = "esp-s3"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp-s3"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
rtt-target = "0.6.2"
# for more networking protocol support see https://crates.io/crates/edge-net
bt-hci = "0.9.0"
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "coex",
  "esp-alloc",
  "esp-now",
  "esp32s3",
  "sniffer",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
trouble-host = { version = "0.7.0", features = [
  "central",
  "derive",
  "gatt",
  "peripheral",
  "scan",
] }   # 53 课 GATT 外设、54 课中心/扫描都需要这些特性

critical-section = "1.2.0"
static_cell      = "2.1.1"

# ============================================================================
# 用户扩展依赖区（esp-generate 不会生成这一段）
#
# 重跑 esp-generate 会覆盖本文件，届时把这一段贴回来即可。
# 每行末尾注明「哪一课要用」，按批逐步补充；版本与 Cargo.lock 中已解析的一致。
# ============================================================================
embassy-sync = "0.8.0"   # 18 课：任务间通信 Signal / Channel / Mutex
embedded-hal = "1.0.0"   # 23 课：用 StatefulOutputPin / DelayNs 等通用 trait 写不认芯片的代码

# --- 第 3~6 批课程追加（无线 / 存储 / HTTP），版本都是 Cargo.lock 里已解析到的 ---
embassy-futures  = "0.1.2"                              # 51/53/54 课：join / select 组合多个 future
heapless         = "0.9.2"                              # 54 课：BLE 扫描结果去重用的 Deque
esp-storage      = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }  # 34/55 课：片内 flash 读写
reqwless         = { version = "0.14.0", default-features = false }                    # 49 课：HTTP 客户端（不带 TLS）
nb               = "1.1.0"                              # 43 课：SHA 驱动的 block!(...) 辅助
sdio             = "0.5.2"                              # 41 课：SD 卡协议栈（esp-hal 的 SDMMC 驱动实现它）
aligned          = "0.4.3"                              # 41 课：SD 卡要求 4 字节对齐的块缓冲
block-device-driver = "0.2.0"                           # 41 课：块设备通用 trait（sdio 实现了它）
embassy-usb      = { version = "0.6.0", default-features = false }  # 42 课：USB 设备栈（CDC-ACM 虚拟串口）


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
# 用 thin 而不是 fat：fat LTO 下 Xtensa 后端会在处理「异步 DMA 中断」的固件时
# 直接崩掉（LLVM ERROR: Cannot select PCREL_WRAPPER ... ，第 39 课 I2S 就会命中）。
# thin 更稳，代码体积/速度和 fat 的差距很小。
lto           = 'thin'
opt-level     = 's'
